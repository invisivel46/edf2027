// stress-mixed: ants, spiders, UFOs, collapsing buildings and explosions at once
// (renderer-scenarios.json). Mission 1 street, player standing still
// (tools/native-scenario-stress-input.txt).
waitmission 900s 5s
god on
ammo on
set edf_console_spawn_per_tick 15
mark stress-mixed baseline-begin
stats
wait 15s
mark stress-mixed baseline-end
spawn ant 150 45
spawn spider 60 55
spawn ufo 20 60
wait 8s
mark stress-mixed combat-begin
destroy radius 120
effects 240 35 3 8
wait 5s
stats
effects 240 35 3 8
wait 5s
effects 240 35 3 8
wait 10s
stats
wait 15s
stats
mark stress-mixed combat-end
killall
wait 10s
stats
mark stress-mixed end
