// readme-horde-gif: the README's opening GIF. Mission 1 street, player standing still
// (tools/native-scenario-stress-input.txt), god mode. The console opens clean on screen;
// the recorder types "spawn ant 1000 80" into it (simulated keystrokes, so the command is
// seen being typed), the console closes and the horde closes in. The script quits ~20 s
// after the spawn.
waitmission 900s 5s
god on
set edf_console_spawn_per_tick 20
wait 3s
clear
console open
wait 5s
console close
wait 20s
quit
