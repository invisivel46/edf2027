// stress-ants: hundreds of ants around the player (renderer-scenarios.json).
// Mission 1 street, player standing still (tools/native-scenario-stress-input.txt).
// Phases, each bracketed by "mark" lines so a report can slice the log:
//   baseline (20 s) -> spawn 300 ants in rings from 40 units (15 per tick) ->
//   swarm (40 s: they close in and bite; god mode keeps the run alive) ->
//   killall (death animations) -> after (15 s).
waitmission 900s 5s
god on
ammo on
set edf_console_spawn_per_tick 15
mark stress-ants baseline-begin
stats
wait 20s
stats
mark stress-ants baseline-end
spawn ant 300 40
wait 10s
mark stress-ants swarm-begin
stats
wait 20s
stats
wait 20s
stats
mark stress-ants swarm-end
killall
mark stress-ants killall
wait 15s
stats
mark stress-ants end
