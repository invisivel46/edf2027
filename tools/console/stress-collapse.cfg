// stress-collapse: destroy many buildings (renderer-scenarios.json).
// Mission 1 street, player standing still (tools/native-scenario-stress-input.txt).
// Every building within 150 units collapses at once (fall models, debris, dust,
// collapse sounds), then after 20 s every standing building on the map.
waitmission 900s 5s
god on
mark stress-collapse baseline-begin
stats
wait 15s
mark stress-collapse baseline-end
destroy radius 150
mark stress-collapse near-begin
wait 10s
stats
wait 10s
mark stress-collapse near-end
destroy all
mark stress-collapse all-begin
wait 10s
stats
wait 20s
stats
mark stress-collapse end
