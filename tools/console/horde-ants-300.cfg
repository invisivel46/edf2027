// horde-ants-300: 300 black ants in rings from 40 units (renderer-scenarios.json; the horde scaling study).
// Mission 1 street, player standing still (tools/native-scenario-stress-input.txt),
// god mode, no firing: the spawned enemies wake at once, close in and attack the
// player and stay engaged through the hold window (only the mission's few soldiers
// shoot back; no killall, so the mission's own waves are left alone).
// Phases: baseline (15 s) -> spawn -> settle (20 s, they close in) ->
// hold (60 s, stats every 15 s: the measurement window) -> quit.
waitmission 900s 5s
god on
set edf_console_spawn_per_tick 20
mark horde baseline-begin
stats
wait 15s
stats
mark horde baseline-end
spawn ant 300 40
wait 20s
mark horde hold-begin
stats
wait 15s
stats
wait 15s
stats
wait 15s
stats
wait 15s
stats
mark horde hold-end
quit
