# EDF codegen fork options (read only by the local rexglue fork, D:/roms2/rexglue-sdk-edf,
# branch edf-codegen; the stock SDK tool ignores these keys). See docs/codegen-fork.md.
# Build with -DEDF_REXGLUE_CODEGEN_EXE=<fork>/out/win-amd64/Release/rexglue.exe.

# Guest registers as C++ locals with PPCContext synced at calls and exits from
# interprocedural READS/WRITES summaries. Off by default.
edf_ipa_locals = false

# Differential audit (needs -DEDF_CODEGEN_FORK_AUDIT=ON): replayable functions get both
# bodies and a wrapper calling edf_ipa_audit() (src/codegen_fork/ipa_audit.cpp).
edf_ipa_audit = false

# Trust the PowerPC ABI at opaque boundaries (imports, indirect calls, native hooks): they
# read only argument, fixed and non-volatile registers, and a function entered from one owes
# only the ABI results. Much more precise summaries; NOT bit-exact for dead volatile values
# (e.g. the volatile CR fields a callback's mfcr saves into a dead stack slot).
edf_ipa_abi_boundary = false

# Model RTTI virtual calls by vtable slot target sets behind a runtime guard (negative result,
# docs/codegen-fork.md step 2), and __fast_sub_X register-passing variants (step 3).
edf_ipa_vtables = false
edf_ipa_fast_abi = false

# Static survey of the pass (one JSON object per function).
edf_ipa_report = "out/codegen-fork/ipa-report.jsonl"

